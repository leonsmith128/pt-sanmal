name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: root
      DB_PASSWORD: sanmal-ci-password

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: sanmal-ci-password
          MARIADB_DATABASE: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Check formatting for changed PHP files
        run: >-
          vendor/bin/pint --test
          app/Actions/ConfirmOvertimeStart.php
          app/Actions/CreateOvertimeRequest.php
          app/Actions/RecordAttendance.php
          app/Console/Commands/RefreshOvertimeStates.php
          app/Enums/AttendanceType.php
          app/Enums/OvertimeApprovalStatus.php
          app/Enums/OvertimeState.php
          app/Http/Controllers/AdminOvertimeRequestController.php
          app/Http/Controllers/OvertimeRequestController.php
          app/Models/AttendanceRecord.php
          app/Models/Employee.php
          app/Models/OvertimeRequest.php
          app/Notifications/OvertimeScheduleNotification.php
          database/migrations/2026_10_20_180954_create_attendance_records_tables.php
          database/migrations/2026_10_29_000001_create_overtime_requests_table.php
          database/migrations/2026_10_29_000002_create_notifications_table.php
          routes/console.php
          routes/web.php
          tests/Feature/OvertimeWorkflowTest.php

      - name: Run static analysis
        run: composer types:check

      - name: Run tests
        run: php artisan test
